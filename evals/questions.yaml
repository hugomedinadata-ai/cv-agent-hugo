  question: "¿Cuántos años de experiencia tiene Hugo?"
  must_include: [["15"]]
- id: azure_honesto
  question: "¿Hugo tiene experiencia con Azure?"
  must_include: [["AWS"]]
  must_not_include: ["experiencia en Azure en"]
- id: banco_azteca
  question: "What did he do at Banco Azteca?"
  must_include: [["Murex", "derivatives", "derivados", "FX"]]
- id: consistencia_logro
  question: "Resume en una frase su resultado en Citibanamex."
  must_include: [["83", "1 hora", "10 minutos"]]
